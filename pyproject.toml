[project]
name = "callqa"
version = "1.0.0"
description = "An LLM judge that scores sales-call transcripts on a six-check rubric and quotes its evidence"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
